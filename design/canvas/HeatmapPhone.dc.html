<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;600;700&family=IBM+Plex+Mono:wght@400;600&family=Inter:wght@400;600&display=swap">
  <style>
    body { margin: 0; }
    .mono { font-family: 'IBM Plex Mono', ui-monospace, monospace; font-feature-settings: 'zero' 1; }
    .num  { font-variant-numeric: tabular-nums; }
    .lbl  { font-family: 'IBM Plex Sans', system-ui, sans-serif; font-weight: 600; }
    .ovr  { font-family: 'IBM Plex Sans', system-ui, sans-serif; font-weight: 600; font-size: 10px; letter-spacing: 0.4px; text-transform: uppercase; }
  </style>
</helmet>

<div style="width: 390px; height: 844px; box-sizing: border-box; background: #0A0C0E; font-family: 'Inter', system-ui, sans-serif; position: relative; overflow: hidden;">

  <!-- full-bleed canvas -->
  <div style="position: absolute; left: 0; top: 0; width: 390px; height: 844px; display: flex; align-items: center; justify-content: center;">
    <div style="position: relative; width: 340px; height: 300px;">
      <svg width="340" height="300" viewBox="0 0 340 300" fill="none" aria-hidden="true" style="opacity: 0.44; display: block;">
        <path d="M170 26 v250" stroke="#7C8894" stroke-width="1.8"/>
        <path d="M60 74 Q170 44 280 74" stroke="#7C8894" stroke-width="1.8"/>
        <path d="M52 108 Q170 76 288 108" stroke="#7C8894" stroke-width="1.8"/>
        <path d="M50 144 Q170 110 290 144" stroke="#7C8894" stroke-width="1.8"/>
        <path d="M56 180 Q170 146 284 180" stroke="#7C8894" stroke-width="1.8"/>
        <path d="M68 214 Q170 184 272 214" stroke="#7C8894" stroke-width="1.8"/>
        <path d="M116 236 Q170 268 224 236" stroke="#7C8894" stroke-width="1.8"/>
        <ellipse cx="196" cy="196" rx="46" ry="34" stroke="#9AA6B2" stroke-width="1.8"/>
      </svg>
      <!-- activation overlay -->
      <div style="position: absolute; left: {{blobX}}; top: {{blobY}}; width: 150px; height: 132px; border-radius: 50%; opacity: {{blobOpacity}}; background: radial-gradient(closest-side, {{blobCore}} 0%, {{blobMid}} 46%, rgba(10,12,14,0) 100%);"></div>
      <div style="position: absolute; left: {{blobX}}; top: {{blobY}}; width: 150px; height: 132px; border-radius: 50%; border: 1.5px dashed {{blobCore}}; opacity: {{ringOpacity}};"></div>
    </div>
  </div>

  <!-- top bar over scrim -->
  <div style="position: absolute; left: 0; top: 0; width: 390px; box-sizing: border-box; background: linear-gradient(rgba(10,12,14,0.94), rgba(10,12,14,0.72) 74%, rgba(10,12,14,0));">
    <div style="height: 56px; display: flex; align-items: center; padding: 0 4px 0 8px; gap: 6px;">
      <div style="width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; flex: none;">
        <svg width="19" height="19" viewBox="0 0 20 20" fill="none" stroke="#E4E8ED" stroke-width="1.8" stroke-linecap="round"><path d="M5 5l10 10 M15 5L5 15"/></svg>
      </div>
      <div style="flex-grow: 1; min-width: 0; display: flex; flex-direction: column; gap: 1px;">
        <span class="lbl" style="font-size: 15px; color: #E4E8ED; line-height: 1.2;">Heatmap viewer</span>
        <span class="mono" style="font-size: 11px; color: #B4BCC6; line-height: 1.2;">ACC-2026-004182</span>
      </div>
      <div style="width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; flex: none;">
        <svg width="19" height="19" viewBox="0 0 20 20" fill="none" stroke="#E4E8ED" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3h5v5 M8 17H3v-5 M17 3l-6 6 M3 17l6-6"/></svg>
      </div>
    </div>
    <div style="padding: 0 14px 16px; display: flex; align-items: center; gap: 9px;">
      <svg width="16" height="16" viewBox="0 0 20 20" aria-hidden="true" style="display: block; flex: none;"><path d="{{activeShape}}" fill="{{blobCore}}"></path></svg>
      <span class="lbl" style="font-size: 14px; color: {{blobCore}};">{{activeName}}</span>
      <div style="flex-grow: 1;"></div>
      <span class="num" style="font-size: 14px; color: #E4E8ED;">{{activeConfidence}}</span>
    </div>
  </div>

  <!-- bottom controls over scrim -->
  <div style="position: absolute; left: 0; bottom: 0; width: 390px; box-sizing: border-box; padding: 26px 0 0; background: linear-gradient(rgba(10,12,14,0), rgba(10,12,14,0.78) 26%, rgba(10,12,14,0.96));">

    <!-- finding selector -->
    <div style="display: flex; gap: 8px; padding: 0 14px 12px; overflow: hidden;">
      <sc-for list="{{findings}}" as="f" hint-placeholder-count="4">
        <div onClick="{{ f.pick }}" style="cursor: pointer; flex: none; min-height: 44px; box-sizing: border-box; display: flex; align-items: center; gap: 7px; padding: 0 13px; border-radius: 10px; background: {{f.bg}}; border: 1px solid {{f.border}};">
          <svg width="15" height="15" viewBox="0 0 20 20" aria-hidden="true" style="display: block; flex: none;"><path d="{{f.shape}}" fill="{{f.fg}}"></path></svg>
          <span class="lbl" style="font-size: 13px; color: {{f.fg}}; white-space: nowrap;">{{f.short}}</span>
        </div>
      </sc-for>
    </div>

    <!-- opacity: discrete stops, each its own 44px target -->
    <div style="padding: 0 14px 12px; display: flex; flex-direction: column; gap: 7px;">
      <div style="display: flex; align-items: baseline; gap: 8px;">
        <span class="ovr" style="color: #B4BCC6;">Overlay opacity</span>
        <span class="num" style="font-size: 12px; color: #E4E8ED;">{{opacityLabel}}</span>
      </div>
      <div style="display: flex; gap: 6px;">
        <sc-for list="{{opacities}}" as="o" hint-placeholder-count="5">
          <div onClick="{{ o.pick }}" style="cursor: pointer; flex-grow: 1; height: 44px; border-radius: 9px; background: {{o.bg}}; border: 1px solid {{o.border}}; display: flex; align-items: center; justify-content: center;">
            <span class="num lbl" style="font-size: 13px; color: {{o.fg}};">{{o.label}}</span>
          </div>
        </sc-for>
      </div>
    </div>

    <!-- legend + disclaimer -->
    <div style="border-top: 1px solid #1C2126; padding: 11px 14px 18px; display: flex; align-items: center; gap: 12px;">
      <div style="display: flex; align-items: center; gap: 7px;">
        <span style="width: 54px; height: 9px; border-radius: 5px; background: linear-gradient(to right, #12293A, #4FA3C4, #F0C070, #FF9A93);"></span>
        <span class="ovr" style="color: #B4BCC6;">Low &rarr; high</span>
      </div>
      <span style="font-size: 11px; color: #B4BCC6; flex-grow: 1; text-align: right; line-height: 1.35;">Advisory only &mdash; not a diagnostic device</span>
    </div>
  </div>
</div>
</x-dc>

<script data-dc-script>
const CIRCLE = 'M10 3a7 7 0 1 1 0 14a7 7 0 0 1 0-14z';
const SQUARE = 'M6.5 3.5h7a3 3 0 0 1 3 3v7a3 3 0 0 1-3 3h-7a3 3 0 0 1-3-3v-7a3 3 0 0 1 3-3z';
const TRIANGLE = 'M8.7 3.6a1.5 1.5 0 0 1 2.6 0l6.1 11.1a1.5 1.5 0 0 1-1.3 2.3H3.9a1.5 1.5 0 0 1-1.3-2.3z';
const OCTAGON = 'M6.9 3h6.2l4.9 4.9v6.2l-4.9 4.9H6.9L2 14.1V7.9z';

const FINDINGS = [
  { short: 'Pneumothorax',  name: 'Tension pneumothorax',           shape: OCTAGON,  fg: '#FF9A93', mid: 'rgba(255,154,147,0.34)', confidence: '0.94', x: '30px',  y: '34px'  },
  { short: 'Shift',         name: 'Mediastinal shift',              shape: OCTAGON,  fg: '#FF9A93', mid: 'rgba(255,154,147,0.34)', confidence: '0.88', x: '116px', y: '96px'  },
  { short: 'Consolidation', name: 'Right lower lobe consolidation', shape: TRIANGLE, fg: '#F0C070', mid: 'rgba(240,192,112,0.34)', confidence: '0.82', x: '172px', y: '148px' },
  { short: 'Cardiomegaly',  name: 'Mild cardiomegaly',              shape: SQUARE,   fg: '#8ECDF2', mid: 'rgba(142,205,242,0.34)', confidence: '0.64', x: '124px', y: '134px' },
];

const OPACITIES = [0, 25, 50, 75, 100];

class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { active: 0, opacity: 75 };
  }

  renderVals() {
    const { active, opacity } = this.state;
    const f = FINDINGS[active];

    return {
      activeName: f.name,
      activeShape: f.shape,
      activeConfidence: f.confidence,
      blobCore: f.fg,
      blobMid: f.mid,
      blobX: f.x,
      blobY: f.y,
      blobOpacity: String(opacity / 100),
      ringOpacity: String(Math.min(1, opacity / 100 + 0.15)),
      opacityLabel: opacity + ' %',

      findings: FINDINGS.map((it, i) => ({
        short: it.short, shape: it.shape,
        fg: i === active ? it.fg : '#B4BCC6',
        bg: i === active ? '#151C25' : 'transparent',
        border: i === active ? it.fg : '#5E6B7A',
        pick: () => this.setState({ active: i }),
      })),

      opacities: OPACITIES.map((v) => ({
        label: String(v),
        bg: v === opacity ? '#4FA3C4' : 'transparent',
        fg: v === opacity ? '#0A0C0E' : '#B4BCC6',
        border: v === opacity ? '#4FA3C4' : '#5E6B7A',
        pick: () => this.setState({ opacity: v }),
      })),
    };
  }
}
</script>
</body>
</html>
