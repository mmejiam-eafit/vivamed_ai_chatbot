<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;600;700&family=IBM+Plex+Mono:wght@400;600&family=Inter:wght@400;600&display=swap">
  <style>
    body { margin: 0; }
    .mono { font-family: 'IBM Plex Mono', ui-monospace, monospace; font-feature-settings: 'zero' 1; }
    .num  { font-variant-numeric: tabular-nums; }
    .lbl  { font-family: 'IBM Plex Sans', system-ui, sans-serif; font-weight: 600; }
    .ovr  { font-family: 'IBM Plex Sans', system-ui, sans-serif; font-weight: 600; font-size: 10px; letter-spacing: 0.4px; text-transform: uppercase; }
  </style>
</helmet>

<div style="width: 390px; height: 844px; box-sizing: border-box; background: #0E141B; font-family: 'Inter', system-ui, sans-serif; display: flex; flex-direction: column; overflow: hidden; position: relative;">

  <div style="height: 56px; flex: none; background: #16273D; display: flex; align-items: center; padding: 0 4px 0 8px; gap: 4px;">
    <div onClick="{{ toggleDrawer }}" style="cursor: pointer; width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; flex: none; border-radius: 8px; background: {{menuBg}};">
      <svg width="20" height="20" viewBox="0 0 20 20" fill="none" stroke="#E4E8ED" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M3 5h14 M3 10h14 M3 15h14"/></svg>
    </div>
    <div style="flex-grow: 1; min-width: 0; display: flex; flex-direction: column; gap: 1px;">
      <span class="lbl" style="font-size: 15px; color: #E4E8ED; line-height: 1.2; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;">Chest CT &mdash; Patient A</span>
      <span class="mono" style="font-size: 11px; color: #B4BCC6; line-height: 1.2;">ACC-2026-004182</span>
    </div>
    <div style="width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; flex: none;">
      <svg width="20" height="20" viewBox="0 0 20 20" fill="none" stroke="#E4E8ED" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h5l2 2h7v8H3z"/></svg>
    </div>
  </div>

  <!-- messages -->
  <div style="flex-grow: 1; min-height: 0; overflow: hidden; padding: 14px 14px 0; display: flex; flex-direction: column; gap: 12px;">
    <sc-for list="{{messages}}" as="m" hint-placeholder-count="4">
      <div style="display: flex; justify-content: {{m.align}};">
        <div style="max-width: 290px; background: {{m.bg}}; border: 1px solid {{m.border}}; border-radius: 14px; padding: 10px 13px; display: flex; flex-direction: column; gap: 5px;">
          <span class="ovr" style="color: {{m.whoFg}};">{{m.who}}</span>
          <span style="font-size: 14px; color: #E4E8ED; line-height: 1.5;">{{m.text}}</span>
        </div>
      </div>
    </sc-for>

    <div style="display: flex; justify-content: flex-start;">
      <div style="background: #151C25; border: 1px solid #2A3442; border-radius: 14px; padding: 13px 15px; display: flex; align-items: center; gap: 5px;">
        <span style="width: 7px; height: 7px; border-radius: 50%; background: #939CA8;"></span>
        <span style="width: 7px; height: 7px; border-radius: 50%; background: #6E7885;"></span>
        <span style="width: 7px; height: 7px; border-radius: 50%; background: #4E5761;"></span>
      </div>
    </div>
  </div>

  <!-- findings sheet, collapsed: the critical count never leaves the screen -->
  <div style="flex: none; background: #151C25; border-top: 1px solid #5E6B7A; border-radius: 14px 14px 0 0; padding: 6px 0 0;">
    <div style="display: flex; justify-content: center; padding-bottom: 4px;">
      <span style="width: 34px; height: 4px; border-radius: 2px; background: #5E6B7A;"></span>
    </div>
    <div style="min-height: 48px; box-sizing: border-box; display: flex; align-items: center; gap: 10px; padding: 0 14px 8px;">
      <svg width="17" height="17" viewBox="0 0 20 20" aria-hidden="true" style="display: block; flex: none;"><path d="M6.9 3h6.2l4.9 4.9v6.2l-4.9 4.9H6.9L2 14.1V7.9z" fill="#FF9A93"></path></svg>
      <span class="lbl" style="font-size: 14px; color: #FF9A93;">2 critical</span>
      <span style="width: 1px; height: 15px; background: #2A3442;"></span>
      <span class="num" style="font-size: 13px; color: #B4BCC6; flex-grow: 1;">6 findings</span>
      <svg width="17" height="17" viewBox="0 0 20 20" fill="none" stroke="#6DB3CE" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12 L10 7 L15 12"/></svg>
    </div>
  </div>

  <!-- composer -->
  <div style="flex: none; background: #0E141B; border-top: 1px solid #2A3442; padding: 10px 12px 16px; display: flex; align-items: flex-end; gap: 9px;">
    <div style="flex-grow: 1; min-height: 46px; box-sizing: border-box; background: #151C25; border: 1px solid #5E6B7A; border-radius: 23px; padding: 12px 16px; display: flex; align-items: center;">
      <span style="font-size: 14px; color: #939CA8;">Ask about this study&hellip;</span>
    </div>
    <div style="width: 46px; height: 46px; flex: none; border-radius: 23px; background: #4FA3C4; display: flex; align-items: center; justify-content: center;">
      <svg width="20" height="20" viewBox="0 0 20 20" fill="none" stroke="#0A0C0E" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M3 10h13 M11 5l5 5-5 5"/></svg>
    </div>
  </div>

  <!-- conversation drawer, overlay at compact -->
  <div style="{{scrimStyle}} position: absolute; left: 0; top: 0; width: 390px; height: 844px; background: rgba(10,12,14,0.66);" onClick="{{ toggleDrawer }}"></div>

  <div style="{{drawerStyle}} position: absolute; left: 0; top: 0; width: 304px; height: 844px; box-sizing: border-box; background: #1B3049; border-right: 1px solid #5E6B7A; flex-direction: column; overflow: hidden;">
    <div style="height: 76px; flex: none; display: flex; align-items: flex-end; padding: 0 16px 12px; gap: 10px;">
      <span class="lbl" style="font-size: 17px; color: #E4E8ED; flex-grow: 1;">Conversations</span>
      <div onClick="{{ toggleDrawer }}" style="cursor: pointer; width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; flex: none; margin-right: -10px;">
        <svg width="19" height="19" viewBox="0 0 20 20" fill="none" stroke="#B4BCC6" stroke-width="1.8" stroke-linecap="round"><path d="M5 5l10 10 M15 5L5 15"/></svg>
      </div>
    </div>

    <div style="flex: none; margin: 0 12px 12px; min-height: 46px; box-sizing: border-box; border-radius: 10px; border: 1px solid #5E6B7A; display: flex; align-items: center; justify-content: center; gap: 8px;">
      <svg width="17" height="17" viewBox="0 0 20 20" fill="none" stroke="#6DB3CE" stroke-width="1.9" stroke-linecap="round"><path d="M10 4v12 M4 10h12"/></svg>
      <span class="lbl" style="font-size: 14px; color: #6DB3CE;">New conversation</span>
    </div>

    <div style="flex-grow: 1; min-height: 0; padding: 0 8px; display: flex; flex-direction: column; gap: 2px;">
      <div class="ovr" style="color: #B4BCC6; padding: 8px 12px 6px;">This week</div>
      <sc-for list="{{conversations}}" as="c" hint-placeholder-count="5">
        <div style="min-height: 44px; box-sizing: border-box; display: flex; flex-direction: column; gap: 2px; padding: 9px 12px; border-radius: 9px; background: {{c.bg}};">
          <div style="display: flex; align-items: center; gap: 7px;">
            <svg width="13" height="13" viewBox="0 0 20 20" aria-hidden="true" style="display: block; flex: none;"><path d="{{c.shape}}" fill="{{c.sevFg}}"></path></svg>
            <span style="font-size: 13px; color: #E4E8ED; line-height: 1.4; flex-grow: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;">{{c.title}}</span>
          </div>
          <span style="font-size: 11px; color: #B4BCC6; padding-left: 20px;">{{c.subtitle}}</span>
        </div>
      </sc-for>
    </div>

    <div style="flex: none; border-top: 1px solid #2A3442; padding: 12px 16px 20px; display: flex; align-items: center; gap: 11px;">
      <span style="width: 34px; height: 34px; flex: none; border-radius: 17px; background: #4FA3C4; display: flex; align-items: center; justify-content: center;">
        <span class="lbl" style="font-size: 13px; color: #0A0C0E;">AR</span>
      </span>
      <div style="flex-grow: 1; min-width: 0; display: flex; flex-direction: column;">
        <span class="lbl" style="font-size: 13px; color: #E4E8ED;">Dr. A. Ramírez</span>
        <span style="font-size: 11px; color: #B4BCC6;">Radiologist</span>
      </div>
    </div>
  </div>
</div>
</x-dc>

<script data-dc-script>
const CIRCLE = 'M10 3a7 7 0 1 1 0 14a7 7 0 0 1 0-14z';
const SQUARE = 'M6.5 3.5h7a3 3 0 0 1 3 3v7a3 3 0 0 1-3 3h-7a3 3 0 0 1-3-3v-7a3 3 0 0 1 3-3z';
const TRIANGLE = 'M8.7 3.6a1.5 1.5 0 0 1 2.6 0l6.1 11.1a1.5 1.5 0 0 1-1.3 2.3H3.9a1.5 1.5 0 0 1-1.3-2.3z';
const OCTAGON = 'M6.9 3h6.2l4.9 4.9v6.2l-4.9 4.9H6.9L2 14.1V7.9z';

class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { drawer: false };
  }

  renderVals() {
    const open = this.state.drawer;
    return {
      toggleDrawer: () => this.setState({ drawer: !open }),
      menuBg: open ? '#1B3049' : 'transparent',
      scrimStyle: open ? 'display: block;' : 'display: none;',
      drawerStyle: open ? 'display: flex;' : 'display: none;',
      messages: [
        {
          who: 'Dr. Ramírez', align: 'flex-end', bg: '#1B3049', border: '#2A3442', whoFg: '#B4BCC6',
          text: 'What is driving the 0.94 on the pneumothorax?',
        },
        {
          who: 'Assistant', align: 'flex-start', bg: '#151C25', border: '#2A3442', whoFg: '#939CA8',
          text: 'A visible visceral pleural line in the right apex with absent lung markings peripheral to it, plus 14 mm of leftward mediastinal shift. The shift is what raises it from pneumothorax to tension.',
        },
        {
          who: 'Dr. Ramírez', align: 'flex-end', bg: '#1B3049', border: '#2A3442', whoFg: '#B4BCC6',
          text: 'Show me the prior for comparison.',
        },
        {
          who: 'Assistant', align: 'flex-start', bg: '#151C25', border: '#2A3442', whoFg: '#939CA8',
          text: 'The 2026-02-14 chest CT shows no pleural line and a midline mediastinum. Opening both in the viewer.',
        },
      ],
      conversations: [
        { title: 'Chest CT — Patient A',      subtitle: '2 hours ago · 8 messages', shape: OCTAGON,  sevFg: '#FF9A93', bg: '#16273D' },
        { title: 'Chest X-Ray — Patient C',   subtitle: 'Yesterday · 3 messages',   shape: OCTAGON,  sevFg: '#FF9A93', bg: 'transparent' },
        { title: 'Abdominal MRI — Patient B', subtitle: 'Yesterday · 12 messages',  shape: TRIANGLE, sevFg: '#F0C070', bg: 'transparent' },
        { title: 'Chest CT — Patient D',      subtitle: '2026-05-20 · 5 messages',  shape: SQUARE,   sevFg: '#8ECDF2', bg: 'transparent' },
        { title: 'Chest X-Ray — Patient E',   subtitle: '2026-05-19 · 2 messages',  shape: CIRCLE,   sevFg: '#7FD1A0', bg: 'transparent' },
      ],
    };
  }
}
</script>
</body>
</html>
