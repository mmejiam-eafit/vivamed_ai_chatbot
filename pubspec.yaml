name: radiologist_helper
description: Radiologist Helper — AI-powered chatbot for DICOM study review.
publish_to: none
version: 0.1.0

environment:
  sdk: '>=3.3.0 <4.0.0'
  flutter: '>=3.27.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_svg: ^2.3.0
  shared_preferences: ^2.5.5
  flutter_riverpod: ^2.6.1
  file_picker: ^8.1.7

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

# Type stack — see design_language.md §4. Every weight below is a real file:
# Flutter synthesizes missing weights silently, and faux-bold degrades the
# stroke contrast that makes identifiers legible. Never request a weight that
# is not declared here.
flutter:
  fonts:
    # Display — structure and authority. SIL OFL 1.1.
    - family: IBMPlexSans
      fonts:
        - asset: assets/fonts/IBMPlexSans-Regular.ttf
        - asset: assets/fonts/IBMPlexSans-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/IBMPlexSans-Bold.ttf
          weight: 700
    # Body — sustained clinical reading. SIL OFL 1.1.
    # Digits are PROPORTIONAL by default; numeric styles must request tnum.
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Regular.ttf
        - asset: assets/fonts/Inter-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Inter-Bold.ttf
          weight: 700
    # Mono — machine truth: identifiers, measurements, DICOM tags. SIL OFL 1.1.
    - family: IBMPlexMono
      fonts:
        - asset: assets/fonts/IBMPlexMono-Regular.ttf
        - asset: assets/fonts/IBMPlexMono-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/IBMPlexMono-Bold.ttf
          weight: 700

  uses-material-design: true

  # Brand mark — see assets/brand/README.md. logo-reversed.svg stays
  # unbundled; nothing in lib/ loads it yet.
  assets:
    - assets/brand/logo-mark.svg
    - assets/brand/logo-full.svg
